><!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container" style="text-align:center; padding-top:50px;">
    <h1 id="haloUser">Halo Vrilyaa!</h1>
    <p id="skorTertinggi">Skor Tertinggi Kamu: 130</p>
    <br>
    <a href="game.html" style="background:#69ddff; color:white; padding:12px 25px; border-radius:20px; text-decoration:none; display:inline-block; margin:5px;">Mulai Permainan</a>
    <br><br>
    <a href="#" onclick="logout()" style="background:#ff69b4; color:white; padding:12px 25px; border-radius:20px; text-decoration:none; display:inline-block; margin:5px;">Logout</a>
  </div>

<script>
  let user = JSON.parse(localStorage.getItem('sessionUser'));
  if(user){
    document.getElementById('haloUser').innerText = 'Halo ' + user.nama + '!';
  }
  let high = localStorage.getItem('highScore') || 130;
  document.getElementById('skorTertinggi').innerText = 'Skor Tertinggi Kamu: ' + high;

  function logout(){
    localStorage.removeItem('sessionUser');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
