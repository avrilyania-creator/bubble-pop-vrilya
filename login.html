<!-- Login by Vrilyaa X RPL 2 - Step 3 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - Bubble Pop by Vrilyaa</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="hero" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:12px; width:100%; max-width:400px; text-align:center;">
      <h2 style="color:#69ddff;">LOGIN AKUN</h2>
      <input id="emailLogin" type="email" placeholder="Email" style="width:100%; padding:12px; margin:10px 0; border-radius:12px; border:2px solid #69ddff;">
      <input id="passLogin" type="password" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; border-radius:12px; border:2px solid #69ddff;">
      <button onclick="login()" style="width:100%; background:#69ddff; color:white; padding:12px; border-radius:12px; border:none; font-weight:bold; margin-top:10px;">Masuk</button>
    </div>
  </div>
<script>
function login(){
  let data = JSON.parse(localStorage.getItem('vrilyaa_user'));
  let email = document.getElementById('emailLogin').value;
  let pass = document.getElementById('passLogin').value;
  if(data && data.email==email && data.pass==pass){
    alert('Halo ' + data.nama + '! Login Berhasil!');
    window.location.href = 'dashboard.html';
  } else { alert('Email atau password salah!'); }
}
</script>
</body>
</html>
